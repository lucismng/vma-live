name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Số hiệu phiên bản phát hành (ví dụ: v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup environment files
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Restore or generate debug.keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Artifact
        id: prepare_artifact
        run: |
          mkdir -p release-artifacts
          TAG_VAL="${{ github.event.inputs.tag }}"
          if [ -z "$TAG_VAL" ]; then
            TAG_VAL="${{ github.ref_name }}"
          fi
          if [ -z "$TAG_VAL" ] || [ "$TAG_VAL" = "main" ]; then
            TAG_VAL="v1.0.1"
          fi
          echo "tag_name=$TAG_VAL" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/vma-live-tv-$TAG_VAL.apk || cp app/build/outputs/apk/debug/*.apk release-artifacts/vma-live-tv.apk

      - name: Upload APK to Artifacts (Tải trực tiếp)
        uses: actions/upload-artifact@v4
        with:
          name: vma-live-tv-apk
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifact.outputs.tag_name }}
          name: "VMA Live TV ${{ steps.prepare_artifact.outputs.tag_name }}"
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
